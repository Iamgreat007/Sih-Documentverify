<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="aadhaarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Card Outline -->
  <rect x="10" y="10" width="780" height="480" rx="16" fill="url(#aadhaarBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top Header Bars (Indian Tricolor theme) -->
  <rect x="10" y="10" width="780" height="12" rx="16 16 0 0" fill="#f97316"/>
  <rect x="10" y="22" width="780" height="8" fill="#ffffff"/>
  <rect x="10" y="30" width="780" height="8" fill="#16a34a"/>

  <!-- Government Emblem Header Area -->
  <g transform="translate(40, 50)">
    <!-- Ashoka Emblem outline -->
    <circle cx="25" cy="25" r="22" fill="#0284c7" opacity="0.1"/>
    <text x="60" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">भारत सरकार</text>
    <text x="60" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">Government of India</text>
  </g>

  <!-- Aadhaar Red Sunburst Logo (Top Right) -->
  <g transform="translate(680, 50)">
    <circle cx="40" cy="25" r="24" fill="#dc2626" opacity="0.9"/>
    <path d="M40 8 L40 42 M23 25 L57 25 M28 13 L52 37 M28 37 L52 13" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="40" cy="25" r="10" fill="#dc2626"/>
    <text x="40" y="60" font-family="Arial" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">आधार</text>
  </g>

  <!-- Photo Box (Left) -->
  <g transform="translate(45, 120)">
    <rect x="0" y="0" width="160" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="80" cy="75" r="40" fill="#64748b"/>
    <path d="M20 180 C20 130, 140 130, 140 180 Z" fill="#475569"/>
    <!-- Small UIDAI watermark on photo -->
    <text x="80" y="194" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">VERIFIED PHOTO</text>
  </g>

  <!-- Identity Details (Middle) -->
  <g transform="translate(230, 130)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">नाम / Name</text>
    <text x="0" y="46" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Rahul Sharma</text>
    <text x="0" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">राहुल शर्मा</text>

    <text x="0" y="106" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">जन्म तिथि / Date of Birth</text>
    <text x="0" y="130" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#0f172a">14/03/2003</text>

    <text x="0" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">लिंग / Gender</text>
    <text x="0" y="188" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Male / पुरुष</text>
  </g>

  <!-- Secure QR Code Simulation (Right) -->
  <g transform="translate(560, 120)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- QR Corner Targets -->
    <rect x="15" y="15" width="40" height="40" fill="#0f172a" rx="4"/>
    <rect x="23" y="23" width="24" height="24" fill="#ffffff" rx="2"/>
    <rect x="29" y="29" width="12" height="12" fill="#0f172a"/>

    <rect x="125" y="15" width="40" height="40" fill="#0f172a" rx="4"/>
    <rect x="133" y="23" width="24" height="24" fill="#ffffff" rx="2"/>
    <rect x="139" y="29" width="12" height="12" fill="#0f172a"/>

    <rect x="15" y="125" width="40" height="40" fill="#0f172a" rx="4"/>
    <rect x="23" y="133" width="24" height="24" fill="#ffffff" rx="2"/>
    <rect x="29" y="139" width="12" height="12" fill="#0f172a"/>

    <!-- Simulated QR data cells -->
    <rect x="70" y="25" width="15" height="15" fill="#0f172a"/>
    <rect x="95" y="35" width="15" height="25" fill="#0f172a"/>
    <rect x="75" y="65" width="35" height="15" fill="#0f172a"/>
    <rect x="25" y="75" width="30" height="30" fill="#0f172a"/>
    <rect x="125" y="75" width="20" height="25" fill="#0f172a"/>
    <rect x="80" y="105" width="30" height="20" fill="#0f172a"/>
    <rect x="120" y="115" width="35" height="35" fill="#0f172a"/>
    <rect x="70" y="145" width="25" height="20" fill="#0f172a"/>

    <text x="90" y="202" font-family="Arial" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">Secure Digital QR</text>
  </g>

  <!-- Big Masked Aadhaar Number -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="720" height="65" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="360" y="44" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="6">
      XXXX XXXX 7821
    </text>
  </g>

  <!-- Bottom Slogan Ribbon -->
  <rect x="10" y="445" width="780" height="45" rx="0 0 16 16" fill="#dc2626"/>
  <text x="400" y="473" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    मेरा आधार, मेरी पहचान (Mera Aadhaar, Meri Pehchan)
  </text>
</svg>
