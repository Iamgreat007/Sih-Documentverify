<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tamperedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
  </defs>

  <!-- Card Body with slight distortion -->
  <rect x="10" y="10" width="780" height="480" rx="16" fill="url(#tamperedBg)" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Top Header Bars -->
  <rect x="10" y="10" width="780" height="12" rx="16 16 0 0" fill="#f97316"/>
  <rect x="10" y="22" width="780" height="8" fill="#ffffff"/>
  <rect x="10" y="30" width="780" height="8" fill="#16a34a"/>

  <!-- Government Emblem Header Area -->
  <g transform="translate(40, 50)">
    <circle cx="25" cy="25" r="22" fill="#0284c7" opacity="0.1"/>
    <text x="60" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">भारत सरकार</text>
    <text x="60" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">Government of India</text>
  </g>

  <!-- Aadhaar Red Sunburst Logo -->
  <g transform="translate(680, 50)">
    <circle cx="40" cy="25" r="24" fill="#dc2626" opacity="0.9"/>
    <path d="M40 8 L40 42 M23 25 L57 25 M28 13 L52 37 M28 37 L52 13" stroke="#ffffff" stroke-width="2.5"/>
    <text x="40" y="60" font-family="Arial" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">आधार</text>
  </g>

  <!-- Photo Box with visible splice / digital tampering overlay -->
  <g transform="translate(45, 120)">
    <rect x="0" y="0" width="160" height="200" rx="10" fill="#f1f5f9" stroke="#ef4444" stroke-width="3"/>
    <!-- Misaligned photo paste rectangle -->
    <rect x="10" y="12" width="140" height="175" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="80" cy="75" r="38" fill="#9f1239"/>
    <path d="M25 175 C25 125, 135 125, 135 175 Z" fill="#881337"/>
    <!-- Tamper visual mark -->
    <rect x="12" y="14" width="136" height="26" fill="#e11d48" opacity="0.85" rx="3"/>
    <text x="80" y="31" font-family="Arial" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">⚠️ PHOTO SPLICED</text>
  </g>

  <!-- Identity Details with mismatched altered DOB -->
  <g transform="translate(230, 130)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">नाम / Name</text>
    <text x="0" y="46" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Rahul Sharma</text>
    <text x="0" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">राहुल शर्मा</text>

    <text x="0" y="106" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">जन्म तिथि / Date of Birth</text>
    <!-- Altered font patch box -->
    <rect x="-6" y="112" width="160" height="26" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="4"/>
    <text x="0" y="130" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#dc2626">14/03/1990</text>
    <text x="165" y="128" font-family="Arial" font-size="10" font-weight="bold" fill="#dc2626">⚠️ MISMATCH</text>

    <text x="0" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">लिंग / Gender</text>
    <text x="0" y="188" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Male / पुरुष</text>
  </g>

  <!-- Tampered QR code box (damaged) -->
  <g transform="translate(560, 120)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <rect x="15" y="15" width="40" height="40" fill="#dc2626" rx="4"/>
    <rect x="125" y="15" width="40" height="40" fill="#dc2626" rx="4"/>
    <line x1="10" y1="10" x2="170" y2="170" stroke="#e11d48" stroke-width="3" opacity="0.6"/>
    <text x="90" y="100" font-family="Arial" font-size="12" font-weight="bold" fill="#e11d48" text-anchor="middle">QR CHECKSUM FAIL</text>
  </g>

  <!-- Aadhaar Number -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="720" height="65" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <text x="360" y="44" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#991b1b" text-anchor="middle" letter-spacing="6">
      XXXX XXXX 7821
    </text>
  </g>

  <!-- Bottom Alert Ribbon -->
  <rect x="10" y="445" width="780" height="45" rx="0 0 16 16" fill="#be123c"/>
  <text x="400" y="473" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ⚠️ TAMPER TEST SAMPLE: DIGITAL ARTIFACTS INJECTED
  </text>
</svg>
