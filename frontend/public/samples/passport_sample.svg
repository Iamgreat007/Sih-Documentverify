<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="passportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#ebe3d5"/>
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="#d5c8b5" stroke-width="0.8" opacity="0.35"/>
      <path d="M0 20 Q10 40 20 20 T40 20" fill="none" stroke="#cbb89f" stroke-width="0.8" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Card Body -->
  <rect x="10" y="10" width="780" height="500" rx="16" fill="url(#passportBg)" stroke="#c4b59d" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="480" rx="12" fill="url(#guilloche)"/>

  <!-- Top Header -->
  <rect x="20" y="20" width="760" height="60" fill="#1b2a4a" rx="12 12 0 0"/>
  <text x="400" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="3">REPUBLIC OF INDIA / भारत गणराज्य</text>
  <text x="400" y="66" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="4">PASSPORT / पासपोर्ट</text>

  <!-- Ashoka Emblem Symbol -->
  <circle cx="65" cy="50" r="18" fill="#e2e8f0" opacity="0.15"/>
  <circle cx="735" cy="50" r="18" fill="#e2e8f0" opacity="0.15"/>

  <!-- Left Photo Box -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="170" height="220" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Simulated Photo -->
    <rect x="5" y="5" width="160" height="210" rx="6" fill="#cbd5e1"/>
    <!-- Avatar silhouette -->
    <circle cx="85" cy="80" r="42" fill="#64748b"/>
    <path d="M25 185 C25 135, 145 135, 145 185 Z" fill="#475569"/>
    <!-- Photo security stamp -->
    <circle cx="140" cy="190" r="28" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
    <text x="140" y="194" font-family="Arial" font-size="8" fill="#2563eb" font-weight="bold" text-anchor="middle" opacity="0.7">OFFICIAL</text>
  </g>

  <!-- Document Details Grid -->
  <!-- Row 1 -->
  <g transform="translate(245, 105)">
    <text x="0" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Type / प्रकार</text>
    <text x="0" y="30" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#0f172a">P</text>

    <text x="100" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Country Code / देश कोड</text>
    <text x="100" y="30" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#0f172a">IND</text>

    <text x="280" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Passport No. / पासपोर्ट सं.</text>
    <text x="280" y="30" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#0f172a" letter-spacing="1">A1234567</text>
  </g>

  <!-- Row 2: Name -->
  <g transform="translate(245, 155)">
    <text x="0" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Surname / उपनाम</text>
    <text x="0" y="32" font-family="Arial" font-size="16" font-weight="bold" fill="#0f172a">SHARMA</text>

    <text x="280" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Given Name(s) / दिया गया नाम</text>
    <text x="280" y="32" font-family="Arial" font-size="16" font-weight="bold" fill="#0f172a">RAHUL</text>
  </g>

  <!-- Row 3: Nationality, Sex, DOB -->
  <g transform="translate(245, 210)">
    <text x="0" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Nationality / राष्ट्रीयता</text>
    <text x="0" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">INDIAN</text>

    <text x="160" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Sex / लिंग</text>
    <text x="160" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">M</text>

    <text x="280" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Date of Birth / जन्म तिथि</text>
    <text x="280" y="30" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#0f172a">14/03/2003</text>
  </g>

  <!-- Row 4: Place of Issue & Expiry -->
  <g transform="translate(245, 265)">
    <text x="0" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Place of Issue / जारी करने का स्थान</text>
    <text x="0" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">NEW DELHI</text>

    <text x="280" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Date of Expiry / समाप्ति की तिथि</text>
    <text x="280" y="30" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#0f172a">22/08/2032</text>
  </g>

  <!-- Subtle Emblem Watermark -->
  <path d="M 460 170 Q 510 140 560 170 Q 560 250 510 290 Q 460 250 460 170 Z" fill="#d97706" opacity="0.08"/>

  <!-- MRZ Strip (Machine Readable Zone) -->
  <g transform="translate(30, 390)">
    <rect x="0" y="0" width="740" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="30" y="38" font-family="Courier, 'OCR-B', monospace" font-size="21" font-weight="bold" fill="#0f172a" letter-spacing="4.5">P&lt;INDSHARMA&lt;&lt;RAHUL&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
    <text x="30" y="70" font-family="Courier, 'OCR-B', monospace" font-size="21" font-weight="bold" fill="#0f172a" letter-spacing="4.5">A1234567&lt;4IND0303142M3208221&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;04</text>
  </g>
</svg>
