<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="visaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="780" height="500" rx="16" fill="url(#visaBg)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Guilloche / Security Header -->
  <rect x="20" y="20" width="760" height="55" rx="12 12 0 0" fill="#0f766e"/>
  <text x="400" y="44" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">VISA / ENTRY PERMIT</text>
  <text x="400" y="63" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#ccfbf1" text-anchor="middle" letter-spacing="2">INTERNATIONAL TRAVEL AUTHORIZATION</text>

  <!-- Photo Box -->
  <g transform="translate(45, 95)">
    <rect x="0" y="0" width="160" height="210" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="80" cy="75" r="40" fill="#64748b"/>
    <path d="M20 180 C20 130, 140 130, 140 180 Z" fill="#475569"/>
    <!-- Stamp -->
    <circle cx="130" cy="180" r="26" fill="none" stroke="#059669" stroke-width="2" opacity="0.6"/>
    <text x="130" y="184" font-family="Arial" font-size="7" fill="#059669" font-weight="bold" text-anchor="middle">APPROVED</text>
  </g>

  <!-- Visa Details Grid -->
  <g transform="translate(240, 100)">
    <text x="0" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Issuing Post / जारी करने का स्थान</text>
    <text x="0" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">NEW DELHI</text>

    <text x="260" y="12" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Visa Number / वीजा संख्या</text>
    <text x="260" y="30" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#dc2626">V98765432</text>

    <text x="0" y="65" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Surname / उपनाम</text>
    <text x="0" y="85" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">SHARMA</text>

    <text x="260" y="65" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Given Names / नाम</text>
    <text x="260" y="85" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">RAHUL</text>

    <text x="0" y="120" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Passport Number / पासपोर्ट सं.</text>
    <text x="0" y="140" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#0f172a">A1234567</text>

    <text x="260" y="120" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Visa Type / श्रेणी</text>
    <text x="260" y="140" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">Tourist / Business (B1/B2)</text>

    <text x="0" y="175" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Entries / प्रविष्टियां</text>
    <text x="0" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">Multiple (M)</text>

    <text x="260" y="175" font-family="Arial" font-size="10" fill="#64748b" font-weight="bold">Expiration Date / समाप्ति तिथि</text>
    <text x="260" y="195" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#0f172a">15/12/2028</text>
  </g>

  <!-- MRZ Strip for Visa -->
  <g transform="translate(30, 390)">
    <rect x="0" y="0" width="740" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="30" y="38" font-family="Courier, 'OCR-B', monospace" font-size="20" font-weight="bold" fill="#0f172a" letter-spacing="4">VNINDSHARMA&lt;&lt;RAHUL&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
    <text x="30" y="70" font-family="Courier, 'OCR-B', monospace" font-size="20" font-weight="bold" fill="#0f172a" letter-spacing="4">V987654324IND0303142M2812158A1234567&lt;&lt;&lt;&lt;&lt;&lt;02</text>
  </g>
</svg>
